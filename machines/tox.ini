[tox]
no_package = True
env_list = lint, unit

[vars]
src_path = "{tox_root}/src"
tests_path = "{tox_root}/tests"
terraform_path = "{tox_root}/terraform"
all_path = {[vars]src_path} {[vars]tests_path}
common_path = "{tox_root}/../common"
common_tests_path = "{[vars]common_path}/tests/unit"
common_src_path = "{[vars]common_path}/common"

[testenv]
set_env =
    PYTHONPATH = {tox_root}/src:{tox_root}/lib
    PY_COLORS = 1
allowlist_externals =
    poetry
    terraform
    mv

[testenv:format]
description = Apply coding style standards to code
commands_pre =
    poetry install --only format
commands =
    poetry lock
    poetry run ruff check --fix {[vars]all_path}
    poetry run ruff format {[vars]all_path}

[testenv:lint]
description = Check code against coding style standards
commands_pre =
    poetry install --only lint
commands =
    poetry check --lock
    poetry run codespell {[vars]all_path}
    poetry run ruff check {[vars]all_path}
    poetry run ruff format --check --diff {[vars]all_path}

[testenv:lint-terraform]
description = Check code against Terraform style standards
commands =
    terraform fmt -check -diff -recursive {[vars]terraform_path}
    terraform -chdir={[vars]terraform_path} init -backend=false
    terraform -chdir={[vars]terraform_path} validate

[testenv:unit]
description = Run unit tests
commands_pre =
    poetry install --only main,charm-libs,unit
commands =
    # Substrate unit tests -> substrate coverage data (machines/src)
    poetry run pytest --numprocesses=auto --cov=src --cov-report=xml --ignore={[vars]tests_path}/integration/ {posargs}
    mv .coverage substrate.dat
    # Common unit tests (machines subset) -> common + substrate coverage data.
    # `--cov=src` is included so the scenario tests keep covering the machines charm
    # source; these src hits are merged with the substrate report generated above.
    poetry run pytest --numprocesses=auto --cov={[vars]common_src_path} --cov=src --cov-report=xml:{[vars]common_path}/coverage.xml {[vars]common_tests_path} --ignore={[vars]common_tests_path}/kubernetes {posargs}
    # Combined report (substrate + common) for TICS — TICS only reads
    # $OPERATOR/.cover/cobertura.xml, so both modules must be in one file.
    mv .coverage common.dat
    poetry run coverage combine substrate.dat common.dat
    poetry run coverage xml -o coverage.xml

[testenv:integration]
description = Run integration tests
pass_env =
    CI
    UBUNTU_PRO_TOKEN
    LANDSCAPE_ACCOUNT_NAME
    LANDSCAPE_REGISTRATION_KEY
commands_pre =
    poetry install --only integration
commands =
    poetry run pytest -v -x --tb native --log-cli-level=INFO -s --ignore={[vars]tests_path}/unit/ {posargs}
